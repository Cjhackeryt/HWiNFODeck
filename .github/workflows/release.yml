name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Macro Deck CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.14

      - name: Add .NET tools to PATH
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"

      - name: Run tests
        run: dotnet test ./tests/HWiNFODeck.Tests/HWiNFODeck.Tests.csproj

      - name: Build plugin package
        run: macrodeck-plugin build --source ./src/HWiNFODeck --output ./artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = Get-ChildItem ./artifacts -Filter *.macroDeckPlugin | Select-Object -First 1
          if ($null -eq $artifact) { throw 'Plugin package was not produced.' }
          gh release create $env:GITHUB_REF_NAME $artifact.FullName --generate-notes
